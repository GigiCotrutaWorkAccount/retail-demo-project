<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Retail Demo Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="nav-container">
        <a href="/" class="brand">RETAIL DEMO</a>
        <div class="cart-icon">
          <a href="/checkout.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span id="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="checkout-page">
      <div class="checkout-container">
        <h2>Your Cart</h2>
        <div class="cart-items" id="cart-items">
          <!-- Populated via TS -->
        </div>
        
        <div class="checkout-summary">
          <div class="summary-row">
            <span>Cart ID</span>
            <span id="cart-id">-</span>
          </div>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="cart-subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>Free</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="cart-total">$0.00</span>
          </div>
          <button class="cta-button checkout-btn" id="checkout-btn">Complete Purchase</button>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Retail Demo Project. All rights reserved.</p>
    </footer>

    <script src="https://cdn.c360a.salesforce.com/beacon/c360a/8b6b4d18-b867-4cc5-8fbc-5fd0b2b6aab0/scripts/c360a.min.js"></script>
    <script type="module" src="/src/checkout.ts"></script>
  </body>
</html>
